# Shared defaults for Pipeline V2 configs

seed: 42
num_cpu: 16

paths:
  session_root: null
  checkpoints: "${paths.session_root}/checkpoints"
  tb_log: "${paths.session_root}/tensorboard"
  logs: "${paths.session_root}/logs"

env:
  module: null
  class: null
  headless: true
  save_final_state: false
  early_stop: false
  action_freq: 24
  init_state: "data/init.state"
  max_steps: 163840
  print_rewards: true
  save_video: false
  fast_video: true
  gb_path: "data/PokemonRed.gb"
  debug: false
  reward_scale: 0.5
  explore_weight: 0.25

model:
  type: null
  policy: null
  n_steps: 2048
  batch_size: 512
  n_epochs: 1
  gamma: 0.997
  ent_coef: 0.01
  tensorboard_log: "${paths.tb_log}"
  verbose: 1

logging:
  format: "json"
  save_freq: 100
  structured: true

save_freq: 163840
total_timesteps: 100000
