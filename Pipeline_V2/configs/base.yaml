# Shared defaults for Pipeline V2 configs

seed: 42
num_cpu: 16

paths:
  session_root: null
  checkpoints: "${paths.session_root}/checkpoints"
  tb_log: "${paths.session_root}/tensorboard"
  logs: "${paths.session_root}/logs"

env:
  module: null
  class: null
  headless: true
  save_final_state: false
  send_map_to_agent: false # v3 und v4 bekommen wenn true eine map mitgesandt!
  pack_bits: true
  use_shared_memory: true
  log_stats_to_file: true
  stats_flush_freq: 200
  early_stop: false
  action_freq: 24
  init_state: "data/init.state"
  max_steps: 163840
  print_rewards: true
  save_video: false
  fast_video: true
  gb_path: "data/PokemonRed.gb"
  debug: false
  reward_scale: 0.5
  explore_weight: 0.25

model:
  type: null
  policy: null
  # n_steps: Overridden at runtime by BaseTrainer._apply_n_steps_formula()
  # Formula: max_steps // num_cpu (Peter Whidden's approach)
  # Example: 163840 // 16 = 10240 (ensures 1 reset per rollout buffer)
  n_steps: 2048  # Placeholder only - actual value calculated dynamically
  batch_size: 512
  n_epochs: 3  # Peter Whidden's baseline. Can increase to 3 for better sample efficiency.
  gamma: 0.997
  ent_coef: 0.01
  tensorboard_log: "${paths.tb_log}"
  verbose: 1

logging:
  format: "csv"
  save_freq: 100
  structured: true

# Checkpoint frequency (Peter Whidden's formula: ep_length // 2)
# Saves model every half episode for better recovery on crashes
save_freq: 81920  # 163840 // 2

# Total training duration (Peter Whidden's formula: ep_length * num_cpu * iterations)
# Original: 163840 * 64 * 10000 = ~105 billion steps
# Scaled for num_cpu=16: 163840 * 16 * ~38000 ≈ 100 million steps
total_timesteps: 1e8
