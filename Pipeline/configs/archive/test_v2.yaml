# configs/test_v2.yaml - Kurzer Test für v2 vor worker-rank Implementation

# -------------------------------------------------------------------
# 1) Allgemeine Settings  
# -------------------------------------------------------------------
seed: 42
num_cpu: 4  # Reduziert für Test

# -------------------------------------------------------------------
# 2) Pfade (werden in train.py relativ zum Projekt‑Root aufgelöst)
# -------------------------------------------------------------------
paths:
  session_root: "experiments/test_v2"
  checkpoints:   "${paths.session_root}/checkpoints"
  tb_log:        "${paths.session_root}/tensorboard"
  json_logs:     "${paths.session_root}/json_logs"

# -------------------------------------------------------------------
# 3) Environment‑Konfiguration
# -------------------------------------------------------------------
env:
  module: "red_gym_env_v2_adapted"
  class: "RedGymEnv"
  headless:         true
  save_final_state: false
  early_stop:       false
  action_freq:      24
  init_state:       "data/init.state"
  max_steps:        5000        # Stark reduziert für Test (ca. 2-3 Rollouts)
  print_rewards:    true
  save_video:       false
  fast_video:       true
  gb_path:          "data/PokemonRed.gb"
  debug:            false
  reward_scale:     0.5
  explore_weight:   0.25

# -------------------------------------------------------------------
# 4) Modell‑Hyperparameter
# -------------------------------------------------------------------
model:
  type:            "PPO"
  policy:          "MultiInputPolicy"
  n_steps:         2048        # rollout-Länge
  batch_size:      512
  n_epochs:        1
  gamma:           0.997
  ent_coef:        0.01
  tensorboard_log: "${paths.tb_log}"
  verbose:         1

# -------------------------------------------------------------------
# 5) Trainingslauf
# -------------------------------------------------------------------
total_timesteps:   50000       # Kurzer Test: ~10 Rollouts à 5000 steps
save_freq:         5000        # Checkpoint nach jedem Episode-Ende
save_freq_stats:   50          # Häufigere Stats für debugging
